name: Isolated Laravel tests
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ucrm-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_DEBUG: 'false'
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_DRIVER: array
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      BCRYPT_ROUNDS: '4'
      LOG_CHANNEL: stderr
      STRIPE_PUBLIC: pk_test_fixture
      STRIPE_SECRET: sk_test_fixture
      STRIPE_PRICE_ID: price_fixture
      STRIPE_WEBHOOK_SECRET: whsec_fixture
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, curl, dom, fileinfo, gd, intl, mbstring, openssl, pdo_sqlite, sqlite3, tokenizer, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2
      - name: Install locked dependencies without application scripts
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts
      - name: PHP syntax
        run: git ls-files -z '*.php' | xargs -0 -n1 php -l
      - name: Test without any network interface or external database
        run: |
          runner_user="$(id -un)"
          sudo --preserve-env unshare --net -- runuser -u "$runner_user" --preserve-environment -- bash -c '
            set -eu
            php artisan package:discover --ansi
            php vendor/bin/phpunit --display-warnings --fail-on-warning
          '
